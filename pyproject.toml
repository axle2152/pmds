# Install this folder once:
#     pip install -e <this folder>      (the folder holding this file, not pmds/ inside it)
# That installs
#   - the pmds package (Apache 2.0), so GNU Radio Companion can always find it, and
#   - the PMDS add-on for the all-mode-receiver tuner: pmds_addon.py and pmds_monitor.py
#     (GPL-3.0-or-later, like the other GNU Radio files here), found by the tuner through the
#     all_mode_receiver.addons entry point below.
# The other GNU Radio blocks and tools (pmds_*.py, skywave_channel.py) are GPL-3.0-or-later
# and are not installed.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pmds"
version = "0.2.0"
description = "PMDS (Phase Modulation Data Service): RDS-style station data on the phase of an AM carrier"
readme = "README.md"
license = {text = "Apache-2.0 (the pmds package); GPL-3.0-or-later (pmds_addon.py, pmds_monitor.py)"}
authors = [{name = "Michael Foley"}]
requires-python = ">=3.8"
dependencies = ["numpy"]

[project.entry-points."all_mode_receiver.addons"]
pmds = "pmds_addon:Addon"

[tool.setuptools]
packages = ["pmds"]
py-modules = ["pmds_addon", "pmds_monitor"]
